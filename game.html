<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHADOWS OF THE LOST KINGDOM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d13;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;background:#18251d}
#menu{position:fixed;inset:0;background:radial-gradient(#263b35,#080d13);display:flex;align-items:center;justify-content:center;z-index:5}
.panel{background:#111d25;border:2px solid #b58b42;border-radius:15px;padding:28px;width:min(440px,92vw);text-align:center;box-shadow:0 0 35px #000}
h1{color:#e9bd67;font-size:30px;margin:5px}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:7px;border:1px solid #9d814d;background:#1b2a32;color:white;font-size:16px}
button{background:#8a622c;border:0;font-weight:bold;cursor:pointer}
button:hover{background:#bd8b3e}
#hud{position:fixed;top:12px;left:12px;width:245px;background:#071019dd;padding:12px;border:1px solid #8b713f;border-radius:9px;display:none}
.bar{height:13px;background:#333;border-radius:8px;margin:5px 0 9px;overflow:hidden}
.fill{height:100%;width:100%;transition:width .15s}
#hpFill{background:#d33}
#mpFill{background:#398fe2}
#xpFill{background:#e3b94c}
#stats{font-size:13px;line-height:1.6}
#help{position:fixed;bottom:12px;left:12px;background:#071019bb;padding:10px;border-radius:8px;font-size:12px;display:none}
#message{position:fixed;top:22px;left:50%;transform:translateX(-50%);background:#111d25;padding:12px 22px;border:1px solid #c49a4c;border-radius:8px;display:none;z-index:4}
#quest{position:fixed;right:12px;top:12px;background:#071019dd;padding:12px;border:1px solid #8b713f;border-radius:8px;max-width:220px;display:none;font-size:13px}
#death{position:fixed;inset:0;background:#080d13eF;display:none;align-items:center;justify-content:center;z-index:6}
.small{font-size:12px;color:#bbb}
</style>
</head>
<body>

<div id="menu">
 <div class="panel">
  <h1>SHADOWS OF THE<br>LOST KINGDOM</h1>
  <p class="small">Kayıp Krallığın Gölgesinde</p>
  <input id="heroName" placeholder="Karakterinin adı">
  <select id="heroClass">
   <option value="warrior">Savaşçı</option>
   <option value="mage">Büyücü</option>
   <option value="knight">Şövalye</option>
  </select>
  <button onclick="startGame()">MACERAYA BAŞLA</button>
  <p class="small">REXSUS STUDIOS © 2026</p>
 </div>
</div>

<div id="hud">
 <b id="heroLabel">Kahraman</b>
 <div id="classLabel" class="small"></div>
 <div>CAN</div><div class="bar"><div id="hpFill" class="fill"></div></div>
 <div>MANA</div><div class="bar"><div id="mpFill" class="fill"></div></div>
 <div>DENEYİM</div><div class="bar"><div id="xpFill" class="fill"></div></div>
 <div id="stats"></div>
</div>

<div id="quest"></div>
<div id="message"></div>
<div id="help">
 <b>WASD:</b> Hareket | <b>Fare:</b> Yön ve saldırı<br>
 <b>Q / E / R:</b> Yetenekler | <b>SPACE:</b> Atılma<br>
 <b>F:</b> NPC ile konuş | <b>1:</b> Can iksiri
</div>

<div id="death">
 <div class="panel">
  <h1>YENİLGİ</h1>
  <p>Bu macera burada bitmedi.</p>
  <button onclick="location.reload()">YENİDEN BAŞLA</button>
 </div>
</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight;
canvas.width=W;canvas.height=H;
onresize=()=>{W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H};

const WORLD={w:2400,h:1800};
let running=false,last=0,frame=0;
let camera={x:0,y:0};
let keys={},mouse={x:W/2,y:H/2,down:false};
let player=null;
let enemies=[],projectiles=[],effects=[],npcs=[],trees=[],buildings=[];
let quest={active:false,kills:0,target:5,done:false};
let safeZone={x:500,y:450,r:260};
let messageTimer=0;
let attackTimer=0;
let spawnTimer=0;

const rand=(a,b)=>Math.random()*(b-a)+a;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function say(t){
 const el=document.getElementById("message");
 el.textContent=t;el.style.display="block";messageTimer=180;
}
function inSafe(x,y){
 return Math.hypot(x-safeZone.x,y-safeZone.y)<safeZone.r;
}
function startGame(){
 const name=document.getElementById("heroName").value.trim()||"Gezgin";
 const type=document.getElementById("heroClass").value;
 const configs={
  warrior:{hp:150,mp:75,damage:19,speed:2.7,label:"Savaşçı"},
  mage:{hp:105,mp:145,damage:15,speed:2.65,label:"Büyücü"},
  knight:{hp:185,mp:105,damage:17,speed:2.35,label:"Şövalye"}
 };
 const c=configs[type];
 player={
  x:WORLD.w/2,y:WORLD.h/2+300,r:17,
  name,type,hp:c.hp,maxHp:c.hp,mp:c.mp,maxMp:c.mp,
  damage:c.damage,speed:c.speed,level:1,xp:0,nextXp:100,
  gold:30,kills:0,potions:3,facing:0,
  attackCd:0,dashCd:0,invincible:0,
  skillCd:{q:0,e:0,r:0},
  boost:0,shield:0
 };
 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="block";
 document.getElementById("help").style.display="block";
 document.getElementById("quest").style.display="block";
 document.getElementById("heroLabel").textContent=name;
 document.getElementById("classLabel").textContent=c.label;
 createWorld();
 running=true;
 say("Kayıp Krallığa hoş geldin!");
 requestAnimationFrame(loop);
}

function createWorld(){
 // Köy binaları
 buildings=[
  {x:390,y:350,w:120,h:100,c:"#76543b"},
  {x:570,y:340,w:130,h:110,c:"#66503c"},
  {x:400,y:560,w:130,h:100,c:"#806044"},
  {x:600,y:560,w:120,h:100,c:"#72513a"}
 ];
 npcs=[
  {x:510,y:470,name:"Görev Ustası",color:"#e6c16a",type:"quest"},
  {x:650,y:480,name:"Şifacı",color:"#72c9b1",type:"healer"},
  {x:410,y:690,name:"Tüccar",color:"#d5a1e8",type:"shop"}
 ];
 for(let i=0;i<110;i++){
  let x=rand(80,WORLD.w-80),y=rand(80,WORLD.h-80);
  if(!inSafe(x,y))trees.push({x,y,r:rand(13,24)});
 }
 for(let i=0;i<9;i++)spawnEnemy();
}

function spawnEnemy(){
 let x,y;
 do{x=rand(100,WORLD.w-100);y=rand(100,WORLD.h-100)}
 while(inSafe(x,y)||dist({x,y},player)<350);
 // Yakın dövüşçü ve büyücü düşmanlar
 const mage=Math.random()<0.27;
 enemies.push({
  x,y,r:mage?15:18,
  type:mage?"mage":"melee",
  hp:mage?65:95,maxHp:mage?65:95,
  speed:mage?0.65:0.78,
  damage:mage?11:15,
  range:mage?245:39,
  attackCd:rand(20,100),
  wander:rand(0,100),
  angle:rand(0,Math.PI*2),
  color:mage?"#9c70d8":"#b84d43",
  dead:false
 });
}

function update(dt){
 if(!running)return;
 frame++;
 const p=player;
 const step=dt/16.67;
 if(p.hp<=0){running=false;document.getElementById("death").style.display="flex";return}
 p.attackCd=Math.max(0,p.attackCd-step);
 p.dashCd=Math.max(0,p.dashCd-step);
 p.invincible=Math.max(0,p.invincible-step);
 p.boost=Math.max(0,p.boost-step);
 p.shield=Math.max(0,p.shield-step);
 for(let k in p.skillCd)p.skillCd[k]=Math.max(0,p.skillCd[k]-step);

 // Oyuncunun yönü fareyi sürekli takip eder.
 const mx=mouse.x+camera.x,my=mouse.y+camera.y;
 p.facing=Math.atan2(my-p.y,mx-p.x);

 let dx=0,dy=0;
 if(keys.w||keys.ArrowUp)dy--;
 if(keys.s||keys.ArrowDown)dy++;
 if(keys.a||keys.ArrowLeft)dx--;
 if(keys.d||keys.ArrowRight)dx++;
 if(dx||dy){
  let l=Math.hypot(dx,dy);dx/=l;dy/=l;
  p.x+=dx*p.speed*step;p.y+=dy*p.speed*step;
 }
 p.x=clamp(p.x,30,WORLD.w-30);
 p.y=clamp(p.y,30,WORLD.h-30);

 // Kamera karakteri her zaman takip eder.
 camera.x=clamp(p.x-W/2,0,WORLD.w-W);
 camera.y=clamp(p.y-H/2,0,WORLD.h-H);

 // Düşman hareket ve saldırı yapay zekâsı.
 for(const e of enemies){
  if(e.dead)continue;
  e.attackCd-=step;
  const d=dist(e,p);
  const safe=inSafe(p.x,p.y);

  if(safe){
   e.angle+=Math.sin(frame/50+e.x)*0.008;
   e.x+=Math.cos(e.angle)*e.speed*0.15*step;
   e.y+=Math.sin(e.angle)*e.speed*0.15*step;
   continue;
  }

  if(e.type==="melee"){
   // Yakın dövüşçüler yalnızca çok yakında vurabilir.
   if(d>34){
    if(d<460){
     e.x+=(p.x-e.x)/d*e.speed*step;
     e.y+=(p.y-e.y)/d*e.speed*step;
    }else{
     e.wander-=step;
     if(e.wander<=0){e.angle=rand(0,Math.PI*2);e.wander=rand(60,160)}
     e.x+=Math.cos(e.angle)*e.speed*0.22*step;
     e.y+=Math.sin(e.angle)*e.speed*0.22*step;
    }
   }else if(e.attackCd<=0&&p.invincible<=0){
    hurtPlayer(e.damage);
    e.attackCd=95;
   }
  }else{
   // Büyücüler mesafeyi koruyup uzaktan büyü atar.
   if(d>205){
    e.x+=(p.x-e.x)/d*e.speed*0.75*step;
    e.y+=(p.y-e.y)/d*e.speed*0.75*step;
   }else if(d<145){
    e.x-=(p.x-e.x)/d*e.speed*0.8*step;
    e.y-=(p.y-e.y)/d*e.speed*0.8*step;
   }
   if(d<310&&e.attackCd<=0){
    enemySpell(e);
    e.attackCd=145;
   }
  }
  e.x=clamp(e.x,20,WORLD.w-20);
  e.y=clamp(e.y,20,WORLD.h-20);
 }
 // Menzilli büyü mermileri.
 for(let i=projectiles.length-1;i>=0;i--){
  const b=projectiles[i];
  b.x+=b.vx*step;b.y+=b.vy*step;b.life-=step;
  if(b.owner==="enemy"&&dist(b,p)<p.r+b.r&&p.invincible<=0){
   hurtPlayer(b.damage);projectiles.splice(i,1);continue;
  }
  if(b.owner==="player"){
   let hit=false;
   for(const e of enemies){
    if(!e.dead&&dist(b,e)<e.r+b.r){
     damageEnemy(e,b.damage);
     hit=true;break;
    }
   }
   if(hit){projectiles.splice(i,1);continue}
  }
  if(b.life<=0)projectiles.splice(i,1);
 }
 // Görsel efektler zamanla kaybolur.
 for(let i=effects.length-1;i>=0;i--){
  effects[i].life-=step;
  if(effects[i].life<=0)effects.splice(i,1);
 }
 // Düşman sayısını dengeli tut.
 spawnTimer-=step;
 if(spawnTimer<=0&&enemies.filter(e=>!e.dead).length<13){
  spawnEnemy();spawnTimer=240;
 }
 if(messageTimer>0){messageTimer-=step;if(messageTimer<=0)document.getElementById("message").style.display="none"}
 p.mp=Math.min(p.maxMp,p.mp+0.035*step);
 updateHud();
}

function hurtPlayer(amount){
 if(player.invincible>0)return;
 if(player.shield>0)amount*=0.25;
 player.hp-=amount;
 player.invincible=24;
}
function enemySpell(e){
 const a=Math.atan2(player.y-e.y,player.x-e.x);
 projectiles.push({
  x:e.x,y:e.y,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,
  r:8,life:125,damage:e.damage,owner:"enemy",color:"#b98cff"
 });
 effects.push({type:"cast",x:e.x,y:e.y,life:20});
}
function damageEnemy(e,amount){
 if(e.dead)return;
 e.hp-=amount;
 effects.push({type:"hit",x:e.x,y:e.y,life:12});
 if(e.hp<=0){
  e.dead=true;player.kills++;player.xp+=25;player.gold+=Math.floor(rand(5,13));
  if(quest.active&&!quest.done){quest.kills++;if(quest.kills>=quest.target){quest.done=true;player.gold+=100;say("Görev tamamlandı! 100 altın kazandın.")}}
  if(player.xp>=player.nextXp){
   player.xp-=player.nextXp;player.level++;player.nextXp=Math.floor(player.nextXp*1.45);
   player.maxHp+=15;player.hp=player.maxHp;player.damage+=3;say("Seviye atladın! Seviye "+player.level);
  }
 }
}
function meleeAttack(){
 if(player.attackCd>0)return;
 player.attackCd=25;
 const p=player;
 const range=player.type==="warrior"?82:70;
 for(const e of enemies){
  if(e.dead)continue;
  const d=dist(p,e),a=Math.atan2(e.y-p.y,e.x-p.x);
  let diff=Math.atan2(Math.sin(a-p.facing),Math.cos(a-p.facing));
  if(d<range&&Math.abs(diff)<0.9)damageEnemy(e,p.damage+(p.boost>0?8:0));
 }
 effects.push({type:"slash",x:p.x,y:p.y,angle:p.facing,life:13});
}
function useSkill(key){
 const p=player;
 if(p.skillCd[key]>0)return;
 if(key==="q"){
  if(p.type==="warrior"){
   if(p.mp<20)return say("Yeterli manan yok!");
   p.mp-=20;p.skillCd.q=180;
   effects.push({type:"whirl",x:p.x,y:p.y,life:35,r:115});
   for(const e of enemies)if(!e.dead&&dist(p,e)<115)damageEnemy(e,35);
  }else if(p.type==="mage"){
   if(p.mp<22)return say("Yeterli manan yok!");
   p.mp-=22;p.skillCd.q=100;
   shootPlayerSpell("ice",48,6.2);
  }else{
   if(p.mp<20)return say("Yeterli manan yok!");
   p.mp-=20;p.skillCd.q=150;p.shield=100;
   effects.push({type:"shield",x:p.x,y:p.y,life:100,r:65});
  }
 }else if(key==="e"){
  if(p.type==="warrior"){
   if(p.mp<28)return say("Yeterli manan yok!");
   p.mp-=28;p.skillCd.e=210;
   effects.push({type:"flame",x:p.x,y:p.y,angle:p.facing,life:30});
   for(const e of enemies){
    if(!e.dead&&dist(p,e)<155){
     const a=Math.atan2(e.y-p.y,e.x-p.x);
     const diff=Math.atan2(Math.sin(a-p.facing),Math.cos(a-p.facing));
     if(Math.abs(diff)<0.8)damageEnemy(e,45);
    }
   }
  }else if(p.type==="mage"){
   if(p.mp<30)return say("Yeterli manan yok!");
   p.mp-=30;p.skillCd.e=180;
   shootPlayerSpell("fire",65,5.5);
  }else{
   if(p.mp<25)return say("Yeterli manan yok!");
   p.mp-=25;p.skillCd.e=190;
   p.hp=Math.min(p.maxHp,p.hp+35);
   effects.push({type:"heal",x:p.x,y:p.y,life:50,r:90});
   say("Şifa ışığı seni iyileştirdi!");
  }
 }else if(key==="r"){
  if(p.type==="warrior"){
   if(p.mp<35)return say("Yeterli manan yok!");
   p.mp-=35;p.skillCd.r=260;p.boost=300;
   effects.push({type:"power",x:p.x,y:p.y,life:55,r:90});
   say("Savaş öfkesi etkin!");
  }else if(p.type==="mage"){
   if(p.mp<45)return say("Yeterli manan yok!");
   p.mp-=45;p.skillCd.r=300;
   effects.push({type:"storm",x:p.x,y:p.y,life:55,r:180});
   for(const e of enemies)if(!e.dead&&dist(p,e)<180)damageEnemy(e,65);
  }else{
   // Şövalyenin kutsal darbesi yerine YERİ YAR!
   if(p.mp<40)return say("Yeterli manan yok!");
   p.mp-=40;p.skillCd.r=320;
   effects.push({type:"earthquake",x:p.x,y:p.y,life:100,r:210});
   for(const e of enemies)if(!e.dead&&dist(p,e)<210)damageEnemy(e,75);
   say("YERİ YAR! Zemin parçalanıyor!");
  }
 }
}
function shootPlayerSpell(kind,damage,speed){
 const p=player;
 const colors={ice:"#74e8ff",fire:"#ff813b"};
 projectiles.push({
  x:p.x+Math.cos(p.facing)*20,y:p.y+Math.sin(p.facing)*20,
  vx:Math.cos(p.facing)*speed,vy:Math.sin(p.facing)*speed,
  r:kind==="ice"?10:12,life:100,damage,owner:"player",color:colors[kind]
 });
}
function dash(){
 if(player.dashCd>0)return;
 player.x+=Math.cos(player.facing)*115;
 player.y+=Math.sin(player.facing)*115;
 player.x=clamp(player.x,25,WORLD.w-25);
 player.y=clamp(player.y,25,WORLD.h-25);
 player.dashCd=100;player.invincible=18;
 effects.push({type:"dash",x:player.x,y:player.y,life:20});
}
function usePotion(){
 if(player.potions<=0)return say("Can iksirin kalmadı!");
 if(player.hp>=player.maxHp)return say("Canın zaten dolu!");
 player.potions--;player.hp=Math.min(player.maxHp,player.hp+65);say("Can iksiri kullandın!");
}

function interact(){
 let n=npcs.find(n=>dist(n,player)<75);
 if(!n)return say("Yakında konuşabileceğin biri yok.");
 if(n.type==="quest"){
  if(quest.done){say("Görevini tamamladın. Ödülünü aldın!");return}
  if(!quest.active){quest.active=true;quest.kills=0;say("Görev: 5 düşmanı yen! Ödül: 100 altın.");}
  else say("Görev ilerlemesi: "+quest.kills+"/"+quest.target);
 }else if(n.type==="healer"){
  player.hp=player.maxHp;player.mp=player.maxMp;say("Şifacı seni tamamen iyileştirdi.");
 }else if(n.type==="shop"){
  if(player.gold>=25){player.gold-=25;player.potions++;say("Bir can iksiri satın aldın.");}
  else say("Bir iksir 25 altın. Yeterli altının yok.");
 }
}
function updateHud(){
 const p=player;
 document.getElementById("hpFill").style.width=100*p.hp/p.maxHp+"%";
 document.getElementById("mpFill").style.width=100*p.mp/p.maxMp+"%";
 document.getElementById("xpFill").style.width=100*p.xp/p.nextXp+"%";
 document.getElementById("stats").innerHTML=
 "Seviye: "+p.level+"<br>Altın: "+p.gold+"<br>Öldürülen düşman: "+p.kills+
 "<br>Hasar: "+p.damage+"<br>Can iksiri: "+p.potions+
 "<br>Yetenek Q: "+(p.skillCd.q<=0?"Hazır":"Bekle")+
 "<br>Yetenek E: "+(p.skillCd.e<=0?"Hazır":"Bekle")+
 "<br>Yetenek R: "+(p.skillCd.r<=0?"Hazır":"Bekle");
 document.getElementById("quest").innerHTML="<b>GÖREV</b><br>"+
 (quest.done?"Tamamlandı!":quest.active?"Düşmanları yen: "+quest.kills+"/"+quest.target:"Görev Ustası ile konuş (F)");
}

function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.save();ctx.translate(-camera.x,-camera.y);
 drawGround();
 drawVillage();
 drawTrees();
 drawEffects();
 drawProjectiles();
 drawEnemies();
 drawNpcs();
 drawPlayer();
 ctx.restore();
}
function drawGround(){
 ctx.fillStyle="#263b2c";ctx.fillRect(0,0,WORLD.w,WORLD.h);
 // Çimen dokusu
 ctx.fillStyle="#304a34";
 for(let x=0;x<WORLD.w;x+=70)for(let y=0;y<WORLD.h;y+=70){
  if((x+y)%140===0)ctx.fillRect(x+10,y+20,3,3);
 }
 // Köy yolu
 ctx.fillStyle="#887657";
 ctx.fillRect(450,0,120,1800);
 ctx.fillRect(0,430,1100,100);
 ctx.fillStyle="#9c8966";
 for(let i=0;i<25;i++)ctx.fillRect(460+i*4,440,2,80);
}
function drawVillage(){
 // Güvenli bölge işareti
 ctx.beginPath();ctx.arc(safeZone.x,safeZone.y,safeZone.r,0,Math.PI*2);
 ctx.fillStyle="#5ca9a022";ctx.fill();
 ctx.strokeStyle="#80d5ba66";ctx.lineWidth=3;ctx.stroke();
 for(const b of buildings){
  ctx.fillStyle=b.c;ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle="#4c3427";
  ctx.beginPath();ctx.moveTo(b.x-12,b.y);ctx.lineTo(b.x+b.w/2,b.y-55);ctx.lineTo(b.x+b.w+12,b.y);ctx.fill();
  ctx.fillStyle="#33251d";ctx.fillRect(b.x+b.w/2-13,b.y+55,26,45);
 }
}
function drawTrees(){
 for(const t of trees){
  ctx.fillStyle="#513b29";ctx.fillRect(t.x-4,t.y,8,18);
  ctx.fillStyle="#174d32";ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#276b42";ctx.beginPath();ctx.arc(t.x-5,t.y-5,t.r*.65,0,Math.PI*2);ctx.fill();
 }
}
function drawNpcs(){
 for(const n of npcs){
  ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(n.x,n.y,15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="12px Arial";ctx.textAlign="center";
  ctx.fillText(n.name,n.x,n.y-25);
  if(dist(n,player)<90)ctx.fillText("[F] Konuş",n.x,n.y+34);
 }
}
function drawEnemies(){
 for(const e of enemies){
  if(e.dead)continue;
  ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();
  if(e.type==="mage"){
   ctx.strokeStyle="#d8aaff";ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,Math.PI*2);ctx.stroke();
   ctx.fillStyle="#eee";ctx.fillRect(e.x-3,e.y-4,6,4);
  }else{
   ctx.fillStyle="#38211e";ctx.fillRect(e.x-7,e.y-5,14,5);
  }
  ctx.fillStyle="#222";ctx.fillRect(e.x-20,e.y-e.r-12,40,5);
  ctx.fillStyle="#d33";ctx.fillRect(e.x-20,e.y-e.r-12,40*e.hp/e.maxHp,5);
 }
}
function drawPlayer(){
 const p=player;
 ctx.save();ctx.translate(p.x,p.y);
 if(p.invincible>0&&Math.floor(frame/4)%2===0)ctx.globalAlpha=.5;
 // Gölge
 ctx.fillStyle="#0006";ctx.beginPath();ctx.ellipse(0,9,18,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle=p.type==="warrior"?"#bd4545":p.type==="mage"?"#7952b5":"#d0b36b";
 ctx.beginPath();ctx.arc(0,0,p.r,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#e8c7a0";ctx.beginPath();ctx.arc(0,-5,9,0,Math.PI*2);ctx.fill();
 // Karakter fare yönüne döner; silah hareketten bağımsız döner.
 ctx.rotate(p.facing);
 ctx.fillStyle=p.type==="mage"?"#b7a0e8":"#b8b8bd";
 if(p.type==="mage"){
  ctx.fillRect(9,-3,29,6);ctx.fillStyle="#7deaff";ctx.beginPath();ctx.arc(40,0,6,0,Math.PI*2);ctx.fill();
 }else{
  ctx.fillRect(10,-3,33,6);
  ctx.fillStyle="#ddd";ctx.beginPath();ctx.moveTo(42,-7);ctx.lineTo(54,0);ctx.lineTo(42,7);ctx.fill();
 }
 ctx.restore();
}
function drawProjectiles(){
 for(const b of projectiles){
  ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=.3;ctx.beginPath();ctx.arc(b.x,b.y,b.r*1.8,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 }
}
function drawEffects(){
 for(const e of effects){
  const alpha=clamp(e.life/40,0,1);
  ctx.save();ctx.globalAlpha=alpha;
  if(e.type==="slash"){
   ctx.strokeStyle="#fff0a0";ctx.lineWidth=7;ctx.beginPath();
   ctx.arc(e.x,e.y,48,e.angle-.65,e.angle+.65);ctx.stroke();
  }else if(e.type==="whirl"){
   ctx.strokeStyle="#e6c36c";ctx.lineWidth=8;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1-e.life/70),0,Math.PI*2);ctx.stroke();
  }else if(e.type==="flame"){
   ctx.strokeStyle="#ff793d";ctx.lineWidth=28;ctx.beginPath();ctx.arc(e.x,e.y,105,e.angle-.75,e.angle+.75);ctx.stroke();
  }else if(e.type==="heal"){
   ctx.strokeStyle="#83ffe0";ctx.lineWidth=5;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1-e.life/70),0,Math.PI*2);ctx.stroke();
  }else if(e.type==="storm"){
   ctx.strokeStyle="#c5a5ff";ctx.lineWidth=5;
   for(let i=0;i<8;i++){
    let a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(e.x+Math.cos(a)*20,e.y+Math.sin(a)*20);
    ctx.lineTo(e.x+Math.cos(a)*e.r,e.y+Math.sin(a)*e.r);ctx.stroke();
   }
  }else if(e.type==="shield"){
   ctx.strokeStyle="#f0d783";ctx.lineWidth=5;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();
  }else if(e.type==="power"){
   ctx.strokeStyle="#ff5c32";ctx.lineWidth=6;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1-e.life/65),0,Math.PI*2);ctx.stroke();
  }else if(e.type==="dash"){
   ctx.fillStyle="#a9e8ff";ctx.beginPath();ctx.arc(e.x,e.y,25*(e.life/20),0,Math.PI*2);ctx.fill();
  }else if(e.type==="hit"||e.type==="cast"){
   ctx.fillStyle=e.type==="hit"?"#ffdf80":"#c8a3ff";ctx.beginPath();ctx.arc(e.x,e.y,12*(e.life/15),0,Math.PI*2);ctx.fill();
  }else if(e.type==="earthquake"){
   // Zemin önce çatlar, sonra çatlaklar kapanır.
   const progress=1-e.life/100;
   const open=progress<.58?progress/.58:(1-progress)/.42;
   const radius=30+progress*170;
   ctx.strokeStyle="#15100d";ctx.lineWidth=5+open*5;
   for(let i=0;i<12;i++){
    const a=i*Math.PI/6;
    const bend=Math.sin(i*7)*12;
    ctx.beginPath();
    ctx.moveTo(e.x+Math.cos(a)*15,e.y+Math.sin(a)*15);
    ctx.lineTo(e.x+Math.cos(a)*(radius*.45)+bend,e.y+Math.sin(a)*(radius*.45));
    ctx.lineTo(e.x+Math.cos(a)*(radius*.75)-bend,e.y+Math.sin(a)*(radius*.75));
    ctx.lineTo(e.x+Math.cos(a)*radius,e.y+Math.sin(a)*radius);
    ctx.stroke();
   }
   ctx.strokeStyle="#c18b55";ctx.lineWidth=2;
   ctx.beginPath();ctx.arc(e.x,e.y,radius,0,Math.PI*2);ctx.stroke();
   if(progress>.58){
    ctx.globalAlpha=alpha*(progress-.58)/.42;
    ctx.fillStyle="#6d9250";ctx.beginPath();ctx.arc(e.x,e.y,radius*.8,0,Math.PI*2);ctx.fill();
   }
  }
  ctx.restore();
 }
}

function loop(t){
 if(!running)return;
 const dt=Math.min(40,t-last||16.67);last=t;
 update(dt);draw();requestAnimationFrame(loop);
}

window.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();keys[k]=true;
 if(!running)return;
 if(k===" "){e.preventDefault();dash()}
 if(k==="q"||k==="e"||k==="r")useSkill(k);
 if(k==="f")interact();
 if(k==="1")usePotion();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
canvas.addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
canvas.addEventListener("mousedown",e=>{if(e.button===0){mouse.down=true;meleeAttack()}});
canvas.addEventListener("mouseup",()=>mouse.down=false);
canvas.addEventListener("contextmenu",e=>e.preventDefault());
setInterval(()=>{if(running&&mouse.down)meleeAttack()},100);
</script>
</body>
</html>
